[workspace]
members = [
  "crates/gumgum-api",
  "crates/gumgum-core",
  "crates/gumgum-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://gumgum.dev"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1"
axum = "0"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
toml = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
