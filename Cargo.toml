[workspace]
members = [
  "crates/gumgum-api",
  "crates/gumgum-core",
  "crates/gumgum-cli",
]
resolver = "3"
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://gumgum.dev"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "1"
axum = "0"
base64 = "0"
bollard = "0"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0"
hmac = "0"
percent-encoding = "2"
proptest = "*"
reqwest = { version = "0", features = ["json", "rustls"], default-features = false }
sha2 = "0"
rusqlite = { version = "0", features = ["bundled"] }
sqlx = { version = "0", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
toml = "1"
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter"] }
