[worker]
name = "api"

[[ingress]]
name = "api-http"
protocol = "http"
port = 3000

[[kv]]
kv_id = "user-counters"
binding = "USER_COUNTERS"
access = "read-write"

[[bucket]]
bucket_id = "visit-requests"
binding = "VISIT_REQUESTS_BUCKET"
access = "read-write"

[[queue.producer]]
queue_id = "visit-events"
binding = "VISIT_EVENTS_QUEUE"

[observability]
enabled = true
