[project]
name = "visit-counter-api"
version = "0.1.0"
description = "GumGum visit-counter API worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
visit-counter-api = "visit_counter_api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
