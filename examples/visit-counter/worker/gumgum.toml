[worker]
name = "visit-counter-worker"

[[database]]
db_id = "visits"
binding = "DATABASE_URL"
access = "read-write"

[[bucket]]
bucket_id = "visit-requests"
binding = "VISIT_REQUESTS_BUCKET"
access = "read-only"

[[queue.consumer]]
queue_id = "visit-events"
binding = "VISIT_EVENTS_QUEUE"

[observability]
enable = true
prometheus_metrics = "/_/metrics"

[[secret]]
name = "kava.fund/visit-counter/worker-token"
binding = "VISIT_COUNTER_WORKER_TOKEN"
