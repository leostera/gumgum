[package]
name = "gumgum-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0"
serde_json = "1"
gumgum-api = { path = "../crates/gumgum-api" }
gumgum-cli = { path = "../crates/gumgum-cli" }
gumgum-core = { path = "../crates/gumgum-core" }

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_identifiers"
path = "fuzz_targets/graph_identifiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_requests"
path = "fuzz_targets/api_requests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cli_args"
path = "fuzz_targets/cli_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bucket_paths"
path = "fuzz_targets/bucket_paths.rs"
test = false
doc = false
bench = false
