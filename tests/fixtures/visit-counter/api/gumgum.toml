[worker]
name = "visit-counter-api"
[worker.checks]
live = "/_/live"
ready = "/_/ready"

[[ingress]]
name = "api-http"
protocol = "http"
port = 3000
local_domain = "api.visit-counter.leostera.dev"
public_domain = "api.visit-counter.leostera.dev"

[[kv]]
kv_id = "user-counters"
binding = "USER_COUNTERS"
access = "read-write"

[[bucket]]
bucket_id = "visit-requests"
binding = "VISIT_REQUESTS_BUCKET"
access = "read-write"

[[queue.producer]]
queue_id = "visit-events"
binding = "VISIT_EVENTS_QUEUE"

[observability]
enabled = true

[limits]
cpus = 0.5
memory_mb = 256
pids = 128
restart = "unless-stopped"
