[worker]
name = "visit-counter-worker"
[worker.checks]
live = "/_/live"
ready = "/_/ready"

[[database]]
db_id = "visits"
binding = "DATABASE_URL"
access = "read-write"

[[bucket]]
bucket_id = "visit-requests"
binding = "VISIT_REQUESTS_BUCKET"
access = "read-only"

[[queue.consumer]]
queue_id = "visit-events"
binding = "VISIT_EVENTS_QUEUE"

[observability]
enabled = true

[limits]
cpus = 0.5
memory_mb = 256
pids = 128
restart = "unless-stopped"
